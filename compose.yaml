version: "3.8"

services:
  backend:
    build: .
    container_name: nestjs-backend
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: mariadb:10.4
    container_name: mariadb
    restart: always
    environment:
      MYSQL_DATABASE: crm
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: