version: "3.8"

services:
  backend:
    build: .
    container_name: nestjs-backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://root:rootpassword@db:3306/crm
    depends_on:
      - db

  db:
    image: mariadb:10.4
    container_name: mariadb
    restart: always
    environment:
      MYSQL_DATABASE: crm
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: